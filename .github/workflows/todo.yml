name: To-Do-Bot
# Der Bot laeuft am Stueck knapp 6 Stunden (Erinnerungen auf ca. 1 Minute genau, Antworten sofort).
# Der stuendliche Start sorgt dafuer, dass immer ein naechster Lauf wartet und nahtlos uebernimmt.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
concurrency:
  group: todo-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python bot.py --minuten=335
        env:
          GEMINI_MODEL: gemini-3.5-flash
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          TODO_GIST_ID: ${{ secrets.TODO_GIST_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
